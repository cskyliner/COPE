[project]
name = "cope-reid"
version = "0.1.0"
description = "Consistent Occlusion and Prompt Enhancement for person re-identification"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "torchaudio==2.5.1",
    "numpy>=1.26,<2",
    "pillow>=10,<12",
    "yacs>=0.1.8,<0.2",
    "timm>=1.0,<2",
    "scikit-image>=0.24,<0.26",
    "tqdm>=4.66,<5",
    "ftfy>=6.2,<7",
    "regex",
    "opencv-python-headless>=4.10,<4.12",
    "einops>=0.8,<0.9",
    "matplotlib>=3.9,<3.11",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
